services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: netplay_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d netplay_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/netplay_db?schema=public"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Missing ENCRYPTION_KEY in .env}"
      SEED_DB: "${SEED_DB:-0}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
