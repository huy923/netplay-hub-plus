services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netplay-hub-plus
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./prisma/dev.db
    command: npm run dev -- --host 0.0.0.0 --port 8080
    restart: unless-stopped
    